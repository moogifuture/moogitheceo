<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f6f7f9">
<title>DARK DEVIL — Coming Soon</title>
<style>
:root{--ink:#171923;--muted:#697080;--line:#e7e9ee;--bg:#f6f7f9}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,Segoe UI,Arial,sans-serif}
.container{width:min(1120px,92%);margin:auto}.top{background:#171923;color:white;text-align:center;padding:10px;font-size:11px;letter-spacing:.18em}
header{background:white;border-bottom:1px solid var(--line)}nav{height:72px;display:flex;align-items:center;justify-content:space-between}
.logo{font-weight:950;letter-spacing:.16em}.logo span{font-weight:400;color:#7c8290}nav a:last-child{font-size:13px;color:#626978;text-decoration:none}
main{min-height:72vh;display:grid;place-items:center;padding:70px 0}.panel{text-align:center;max-width:720px;background:white;border:1px solid var(--line);border-radius:12px;padding:clamp(32px,7vw,72px);box-shadow:0 18px 60px #17192308}
.mark{width:78px;height:78px;border:1px solid #d9dce2;border-radius:50%;display:grid;place-items:center;margin:0 auto 28px;font-size:30px}
.kicker{font-size:11px;letter-spacing:.24em;font-weight:800;color:#737b89}h1{font-size:clamp(42px,8vw,76px);letter-spacing:-.06em;line-height:.98;margin:22px 0}h1 span{display:block;color:#737b89}
p{color:var(--muted);line-height:1.75;max-width:500px;margin:0 auto}.line{width:42px;height:3px;background:#202633;margin:28px auto}
footer{border-top:1px solid var(--line);padding:25px 0;color:var(--muted);font-size:12px}.foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
</style></head><body>
<div class="top">DARK DEVIL STORE · OPENING SOON</div>
<header><div class="container"><nav><div class="logo">DARK <span>DEVIL</span></div><a href="mailto:YOUR-EMAIL@example.com">CONTACT</a></nav></div></header>
<main><div class="container"><section class="panel"><div class="mark">◈</div><div class="kicker">A NEW STORE IS IN THE WORKS</div><h1>DARK DEVIL<span>COMING SOON.</span></h1><div class="line"></div><p>We’re preparing something new. Our store is getting ready, and products will be added here in the future. Check back soon.</p></section></div></main>
<footer><div class="container foot"><span>© 2026 DARK DEVIL</span><span>Thank you for visiting.</span></div></footer>
</body></html>
